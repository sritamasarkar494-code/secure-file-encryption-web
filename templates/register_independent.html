{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>
        Create Independent Account
    </h1>

    <p>
        Create a private account for secure,
        independent file sharing.
    </p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password (minimum 8 characters)"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>


    <p>
        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
